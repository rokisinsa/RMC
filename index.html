<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RMC | RESTARTMANEYCLUB</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff}
body{min-height:100svh;overflow-x:hidden}
.stage{width:100%;background:#000}
.art{
  position:relative;
  width:100vw;
  max-width:1024px;
  margin:0 auto;
  overflow:hidden;
  background:#000;
}
.art>img{
  display:block;
  width:100%;
  height:auto;
  user-select:none;
  -webkit-user-drag:none;
}

/* 色を入れ替えるレイヤー */
.tone,.glow,.shine,.door-hit{position:absolute;pointer-events:none}
.tone{
  z-index:2;
  mix-blend-mode:color;
  opacity:.96;
}
.tone.blue{
  left:1.8%; top:27.2%; width:34.8%; height:47.8%;
  background:#38cfff;
  clip-path:polygon(13% 15%,31% 5%,82% 6%,94% 18%,94% 92%,74% 100%,17% 96%,4% 86%,4% 22%);
}
.tone.purple{
  left:34.2%; top:27.5%; width:33.8%; height:44.8%;
  background:#b23cff;
  clip-path:polygon(18% 9%,50% 0%,82% 9%,94% 18%,94% 91%,80% 100%,20% 100%,6% 91%,6% 18%);
}

/* 高級感のある呼吸する発光 */
.glow{
  z-index:3;
  mix-blend-mode:screen;
  filter:blur(10px);
  opacity:.56;
  animation:breathe 3.8s ease-in-out infinite;
}
.glow.blue{
  left:6%; top:31%; width:29%; height:42%;
  background:radial-gradient(ellipse at 50% 52%,rgba(105,225,255,.75) 0%,rgba(45,178,255,.32) 35%,transparent 72%);
}
.glow.purple{
  left:36.5%; top:31%; width:29%; height:42%;
  background:radial-gradient(ellipse at 50% 52%,rgba(207,110,255,.74) 0%,rgba(135,40,255,.28) 38%,transparent 72%);
  animation-delay:.8s;
}
.glow.gold{
  left:68.5%; top:31%; width:28%; height:42%;
  background:radial-gradient(ellipse at 50% 52%,rgba(255,225,133,.66) 0%,rgba(255,177,37,.24) 38%,transparent 72%);
  animation-delay:1.6s;
}

/* 光が扉を横切る */
.shine{
  z-index:4;
  top:30%;
  width:12%;
  height:44%;
  opacity:0;
  transform:skewX(-12deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);
  mix-blend-mode:screen;
  filter:blur(1px);
  animation:sweep 5.6s ease-in-out infinite;
}
.shine.s1{left:-15%;animation-delay:.2s}
.shine.s2{left:-15%;animation-delay:1.4s}
.shine.s3{left:-15%;animation-delay:2.6s}

/* クリック領域 */
.door-hit{
  z-index:6;
  pointer-events:auto;
  background:transparent;
  border:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
  cursor:pointer;
}
#iceBlueDoor{left:4%;top:29%;width:31%;height:45%}
#purpleDoor{left:35.5%;top:29%;width:31%;height:45%}
#goldDoor{left:67.2%;top:29%;width:30%;height:45%}

/* タップ時の立体感 */
.door-hit:active + .tapfx{opacity:1}
.tapfx{
  position:absolute;
  z-index:5;
  pointer-events:none;
  width:28%;
  height:40%;
  top:33%;
  border-radius:45%;
  opacity:0;
  transition:opacity .12s ease;
  filter:blur(12px);
  mix-blend-mode:screen;
}
.tapfx.blue{left:6%;background:radial-gradient(ellipse,rgba(116,227,255,.55),transparent 68%)}
.tapfx.purple{left:37%;background:radial-gradient(ellipse,rgba(206,113,255,.52),transparent 68%)}
.tapfx.gold{left:69%;background:radial-gradient(ellipse,rgba(255,218,120,.46),transparent 68%)}

@keyframes breathe{
  0%,100%{opacity:.34;transform:scale(.985)}
  50%{opacity:.7;transform:scale(1.025)}
}
@keyframes sweep{
  0%,8%{left:-16%;opacity:0}
  15%{opacity:.75}
  40%{opacity:.55}
  52%{left:104%;opacity:0}
  100%{left:104%;opacity:0}
}

@media (max-width:700px){
  .glow{filter:blur(7px)}
  .shine{height:42%}
}
</style>
</head>
<body>
<main class="stage">
  <div class="art">
    <img src="file_00000000833c820991aac55d8267af46.png" alt="RMC">

    <!-- 元画像の色を、左=アイスブルー／中央=紫／右=ゴールド に変更 -->
    <div class="tone blue"></div>
    <div class="tone purple"></div>

    <!-- 発光アニメーション -->
    <div class="glow blue"></div>
    <div class="glow purple"></div>
    <div class="glow gold"></div>

    <!-- 光が流れる演出 -->
    <div class="shine s1"></div>
    <div class="shine s2"></div>
    <div class="shine s3"></div>

    <!-- 扉のクリック領域 -->
    <button class="door-hit" id="iceBlueDoor" aria-label="アイスブルーの扉"></button>
    <div class="tapfx blue"></div>

    <button class="door-hit" id="purpleDoor" aria-label="紫の扉"></button>
    <div class="tapfx purple"></div>

    <button class="door-hit" id="goldDoor" aria-label="ゴールドの扉"></button>
    <div class="tapfx gold"></div>
  </div>
</main>

<script>
/* リンク先は後で設定 */
const ICE_BLUE_LINK = "";
const PURPLE_LINK = "";
const GOLD_LINK = "";

function go(url){
  if(url) window.location.href=url;
}

document.getElementById("iceBlueDoor").addEventListener("click",()=>go(ICE_BLUE_LINK));
document.getElementById("purpleDoor").addEventListener("click",()=>go(PURPLE_LINK));
document.getElementById("goldDoor").addEventListener("click",()=>go(GOLD_LINK));
</script>
</body>
</html>
