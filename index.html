<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RMC | RESTARTMANEYCLUB</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff}
body{min-height:100svh;overflow-x:hidden}
.stage{width:100%;background:#000}
.art{position:relative;width:100vw;max-width:1536px;margin:0 auto;overflow:hidden}
.art>img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.door-hit{
  position:absolute;
  left:38%;
  top:24%;
  width:24%;
  height:58%;
  z-index:5;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
@media (max-width:700px){.art{margin-top:0}}
</style>
</head>
<body>
<main class="stage">
  <div class="art">
    <img src="file_00000000833c820991aac55d8267af46.png" alt="RMC">
    <button class="door-hit" id="iceBlueDoor" aria-label="アイスブルーの扉"
      style="background:transparent;border:0;padding:0;"></button>
  </div>
</main>

<script>
/* リンク先は、あとでここに設定 */
const ICE_BLUE_LINK = "";

document.getElementById("iceBlueDoor").addEventListener("click", function(){
  if(ICE_BLUE_LINK){
    window.location.href = ICE_BLUE_LINK;
  }
});
</script>
</body>
</html>
