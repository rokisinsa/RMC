# RMC 本番更新：外部（ChatGPT など）が作った更新 payload を受け取り → 検証 → 既存 JSON と比較 → locked 保護
# → 全テスト → main へコミット → Pages 公開確認 まで行う。
# この workflow は予測・分析をしない（スポーツの情報収集・推定は外部の分析側が行い、payload として渡す）。
# 手順の説明: docs/RMC_AUTOMATION.md
name: rmc-production-update

on:
  push:
    branches: [main]
    paths:
      - 'incoming/*.json'
  workflow_dispatch:
    inputs:
      run_id:
        description: "更新回の ID（payload の run_id と同じ。例 rmc-2026-09-27-0600）"
        required: true
        type: string
      source:
        description: "更新を作った主体（payload の source と同じ。例 ChatGPT Automations 06:00）"
        required: true
        type: string
      payload_path:
        description: "リポジトリ内の payload ファイル（incoming/ または tmp/ の下の .json）。payload_json と どちらか一方"
        required: false
        type: string
        default: ""
      payload_json:
        description: "payload の JSON 本文。payload_path と どちらか一方"
        required: false
        type: string
        default: ""
      dry_run:
        description: "true なら検査だけ（data/ も main も変更しない）"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    # client_payload: { run_id, source, payload_path | payload, dry_run }
    types: [rmc-production-update]

permissions:
  contents: write
  pages: write

concurrency:
  group: rmc-production-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORK: .tmp-tests/production-update
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 0. 起動イベントを安全に入力へ変換
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const ev = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          let runId='', source='', payloadPath='', payloadJson='', dry='false';
          if (process.env.GITHUB_EVENT_NAME === 'push') {
            const files = cp.execFileSync('git',['diff-tree','--no-commit-id','--name-only','-r',process.env.GITHUB_SHA],{encoding:'utf8'})
              .trim().split(/\r?\n/).filter(x=>/^incoming\/[^/]+\.json$/.test(x));
            if (files.length !== 1) throw new Error('incoming payload は1コミットにつき1ファイル必須（検出: '+files.length+'）');
            payloadPath=files[0];
            const p=JSON.parse(fs.readFileSync(payloadPath,'utf8'));
            runId=p.run_id||''; source=p.source||'';
          } else if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            const i=ev.inputs||{};
            runId=i.run_id||''; source=i.source||''; payloadPath=i.payload_path||''; payloadJson=i.payload_json||''; dry=String(i.dry_run||'false');
          } else if (process.env.GITHUB_EVENT_NAME === 'repository_dispatch') {
            const p=ev.client_payload||{};
            runId=p.run_id||''; source=p.source||''; payloadPath=p.payload_path||''; payloadJson=p.payload ? JSON.stringify(p.payload) : ''; dry=String(p.dry_run||false);
          } else throw new Error('unsupported event: '+process.env.GITHUB_EVENT_NAME);
          if(!runId || !source) throw new Error('run_id/source missing');
          const scheduled=/^rmc-\\d{8}-(0600|1200|1800|2300)$/.test(runId);\n          const out={RMC_RUN_ID:runId,RMC_SOURCE:source,RMC_PAYLOAD_PATH:payloadPath,RMC_PAYLOAD_JSON:payloadJson,RMC_DRY_RUN:dry,RMC_IS_SCHEDULED:scheduled?"true":"false"};
          const esc=s=>String(s).replace(/%/g,'%25').replace(/\r/g,'%0D').replace(/\n/g,'%0A');
          fs.appendFileSync(process.env.GITHUB_ENV,Object.entries(out).map(([k,v])=>k+'='+esc(v)).join('\n')+'\n');
          NODE

      - name: 1. 受信（run_id・source を payload と照合）
        run: |
          echo "START_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          node scripts/rmc-production-update.mjs --receive --out "$WORK/payload.json"

      - name: 1b. 定時41項目監査を開始（失敗しても最終stepで必ず保存）
        if: env.RMC_IS_SCHEDULED == 'true'
        run: |
          cp data/scheduled-update-checklist.json "$WORK/scheduled-update-checklist.json"
          slot=$(node -e 'const p=require("./'"$WORK"'/payload.json");process.stdout.write(p.slot)')
          scheduled_for=$(node -e 'const p=require("./'"$WORK"'/payload.json");process.stdout.write(p.generated_at.slice(0,10)+"T"+p.slot+":00+09:00")')
          node scripts/rmc-scheduled-checklist.mjs             --file "$WORK/scheduled-update-checklist.json"             --run-id "$RMC_RUN_ID"             --slot "$slot"             --scheduled-for "$scheduled_for"             --source "$RMC_SOURCE"             --start-sha "$START_SHA"             --inventory

      - name: 2. 検証（dry-run：schema・重複・JST・source・未来情報・locked・損益/ROI/CLV）
        run: node scripts/rmc-production-update.mjs --payload "$WORK/payload.json" --dry-run --start-sha "$START_SHA" --report "$WORK/dry-run.json"

      - name: 2b. 定時41項目監査へpayload証跡を反映
        if: always() && env.RMC_IS_SCHEDULED == 'true'
        run: |
          if [ ! -f "$WORK/scheduled-update-checklist.json" ]; then cp data/scheduled-update-checklist.json "$WORK/scheduled-update-checklist.json"; fi
          args=(--file "$WORK/scheduled-update-checklist.json" --run-id "$RMC_RUN_ID")
          [ -f "$WORK/payload.json" ] && args+=(--payload "$WORK/payload.json")
          [ -f "$WORK/dry-run.json" ] && args+=(--report "$WORK/dry-run.json")
          node scripts/rmc-scheduled-checklist.mjs "${args[@]}"

      - name: 3. 反映（検証をすべて通ったときだけ data/ を変更）
        if: env.RMC_DRY_RUN != 'true'
        run: node scripts/rmc-production-update.mjs --payload "$WORK/payload.json" --apply --start-sha "$START_SHA" --report "$WORK/apply.json"

      - name: 4. 変更ファイルの検査（更新してよい data/ のファイルだけ）
        if: env.RMC_DRY_RUN != 'true'
        run: node scripts/rmc-production-update.mjs --check-diff

      - name: 5. 全テスト（snapshot 段・live 段：schema/integrity・PRO EDGE・V2・switch gate・本番更新）
        if: env.RMC_DRY_RUN != 'true'
        run: npm test

      - name: 5b. 定時監査：全tests PASS
        if: env.RMC_DRY_RUN != 'true' && env.RMC_IS_SCHEDULED == 'true'
        run: node scripts/rmc-scheduled-checklist.mjs --file "$WORK/scheduled-update-checklist.json" --run-id "$RMC_RUN_ID" --phase tests --detail "npm test PASS"

      - name: 6. 移行スナップショットの不変性
        if: env.RMC_DRY_RUN != 'true'
        run: node scripts/snapshot-manifest.js verify

      - name: 7. data/*.json のスキーマ・整合性検証
        if: env.RMC_DRY_RUN != 'true'
        run: node scripts/validate-data.js

      - name: 8. locked 保護（更新前の main と比較）
        if: env.RMC_DRY_RUN != 'true'
        run: node scripts/check-locked.js "$START_SHA"

      - name: 9. 監査（競技偏り・損益/ROI/CLV・データ品質）
        if: env.RMC_DRY_RUN != 'true'
        run: node scripts/audit-report.js

      - name: 10. 実運用リハーサル（架空データは data/ のコピーにだけ適用）
        if: env.RMC_DRY_RUN != 'true'
        run: |
          node scripts/rehearsal.js rehearsals/RMC-20260926-REHEARSAL-01
          git checkout -- rehearsals

      - name: 11. 実行記録に全テスト PASS を記録し、変更ファイルを再検査
        if: env.RMC_DRY_RUN != 'true'
        run: |
          node scripts/rmc-production-update.mjs --finalize --run-id "$RMC_RUN_ID" --actions-result pass
          node scripts/rmc-production-update.mjs --check-diff
          node scripts/validate-data.js
          node scripts/check-locked.js "$START_SHA"

      - name: 12. main へコミット・push（全検証 PASS・全テスト PASS・locked 違反 0 のときだけ）
        if: env.RMC_DRY_RUN != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0
          end_sha=""
          for attempt in $(seq 1 5); do
            if [ "$attempt" -gt 1 ]; then
              # 競合したら最新mainへ戻し、同じpayloadを最新データに対して最初から再検証・再適用する。
              git fetch origin main
              git reset --hard origin/main
              latest_sha=$(git rev-parse HEAD)
              node scripts/rmc-production-update.mjs --payload "$WORK/payload.json" --dry-run --start-sha "$latest_sha" --report "$WORK/retry-dry-$attempt.json"
              node scripts/rmc-production-update.mjs --payload "$WORK/payload.json" --apply --start-sha "$latest_sha" --report "$WORK/retry-apply-$attempt.json"
              node scripts/rmc-production-update.mjs --check-diff
              npm test
              node scripts/snapshot-manifest.js verify
              node scripts/validate-data.js
              npm run audit
            fi
            git add data
            if git diff --cached --quiet; then
              # 既に同じrunが別経路で反映済みなら二重適用せず成功。
              if node -e 'const j=require("./data/automation-runs.json");process.exit((j.runs||[]).some(x=>x.run_id===process.env.RMC_RUN_ID)?0:1)'; then
                pushed=1
                end_sha=$(git rev-parse HEAD)
                break
              fi
            else
              git commit -m "RMC production update: $RMC_RUN_ID"
              if git push origin HEAD:main; then
                pushed=1
                end_sha=$(git rev-parse HEAD)
                break
              fi
            fi
            echo "Production push conflicted; retry $attempt/5"
            sleep 2
          done
          [ "$pushed" = "1" ] || exit 1
          echo "END_SHA=$end_sha" >> "$GITHUB_ENV"

      - name: 12b. 定時監査：main commit/push PASS
        if: env.RMC_DRY_RUN != 'true' && env.RMC_IS_SCHEDULED == 'true'
        run: node scripts/rmc-scheduled-checklist.mjs --file "$WORK/scheduled-update-checklist.json" --run-id "$RMC_RUN_ID" --phase commit --detail "main push PASS: $END_SHA" --end-sha "$END_SHA"

      - name: 13. Pages の公開確認・監査記録を published に確定
        if: env.RMC_DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds" > /dev/null || echo "Pages build request skipped/failed; waiting for automatic build"

          # まず production commit が公開されたことを実サイトで確認
          published=0
          for i in $(seq 1 60); do
            if curl -fsS "$base/data/automation-runs.json?cb=$RANDOM" | grep -q "\"run_id\": \"$RMC_RUN_ID\""; then
              code=$(curl -s -o /dev/null -w '%{http_code}' "$base/analysis-v2.html?cb=$RANDOM")
              if [ "$code" = "200" ]; then published=1; break; fi
            fi
            sleep 10
          done
          [ "$published" = "1" ] || { echo "PAGES_RESULT=timeout" >> "$GITHUB_ENV"; exit 1; }

          # 公開済みデータを再取得して、①〜④の収支・オッズ・払戻し・損益を同じ計算ロジックで再計算。
          # result_updates で今回結果が変わった正式採用カードは、非legacyなら exact odds/stake/profit が揃っていなければ失敗。
          # profit_audit と公開再計算値、さらに公開JS/集計ロジックが main と一致しなければ published 扱いにしない。
          public_audit_ok=0
          for i in $(seq 1 60); do
            if node scripts/verify-public-profit.mjs --base "$base" --run-id "$RMC_RUN_ID" --payload "$WORK/payload.json"; then
              public_audit_ok=1
              break
            fi
            sleep 10
          done
          [ "$public_audit_ok" = "1" ] || { echo "PAGES_RESULT=public_profit_audit_timeout" >> "$GITHUB_ENV"; exit 1; }

          # 公開確認できた後だけ audit を pending→published にする。
          # 他の定時更新やコード修正が同時に main へ入っても、最新 main を取り直して run_id 単位で安全に再適用する。
          finalize_pushed=0
          pages_sha=""
          for attempt in $(seq 1 5); do
            git fetch origin main
            git reset --hard origin/main
            node scripts/rmc-production-update.mjs --finalize-pages --run-id "$RMC_RUN_ID"
            git add data/automation-runs.json
            if git diff --cached --quiet; then
              # 既に別実行が published を反映済みなら成功扱い。
              if node -e 'const j=require("./data/automation-runs.json");const r=(j.runs||[]).find(x=>x.run_id===process.env.RMC_RUN_ID);process.exit(r?.pages_result==="published"?0:1)'; then
                finalize_pushed=1
                pages_sha=$(git rev-parse HEAD)
                break
              fi
            else
              git commit -m "RMC Pages verified: $RMC_RUN_ID"
              if git push origin HEAD:main; then
                finalize_pushed=1
                pages_sha=$(git rev-parse HEAD)
                break
              fi
            fi
            echo "Pages audit push conflicted; retry $attempt/5"
            sleep 2
          done
          [ "$finalize_pushed" = "1" ] || { echo "PAGES_RESULT=audit_push_conflict" >> "$GITHUB_ENV"; exit 1; }

          # published 記録そのものも公開サイトへ載ったことを再確認
          # 1 run の行数に依存する grep -A は使わず、JSONとして run_id と pages_result を照合する。
          verified=0
          for i in $(seq 1 60); do
            rm -f /tmp/rmc-public-runs.json
            curl -fsS "$base/data/automation-runs.json?cb=$RANDOM" -o /tmp/rmc-public-runs.json || true
            if [ -s /tmp/rmc-public-runs.json ] && RUN_ID="$RMC_RUN_ID" node -e 'try{const j=JSON.parse(require("fs").readFileSync("/tmp/rmc-public-runs.json","utf8"));const r=(j.runs||[]).find(x=>x.run_id===process.env.RUN_ID);process.exit(r?.pages_result==="published"?0:1)}catch{process.exit(1)}'; then
              code=$(curl -s -o /dev/null -w '%{http_code}' "$base/analysis-v2.html?cb=$RANDOM")
              if [ "$code" = "200" ]; then verified=1; break; fi
            fi
            sleep 10
          done
          [ "$verified" = "1" ] || { echo "PAGES_RESULT=audit_publish_timeout" >> "$GITHUB_ENV"; exit 1; }
          public_audit_ok=0
          for i in $(seq 1 60); do
            if node scripts/verify-public-profit.mjs --base "$base" --run-id "$RMC_RUN_ID" --payload "$WORK/payload.json"; then
              public_audit_ok=1
              break
            fi
            sleep 10
          done
          [ "$public_audit_ok" = "1" ] || { echo "PAGES_RESULT=public_profit_audit_timeout" >> "$GITHUB_ENV"; exit 1; }
          echo "PAGES_RESULT=published (analysis-v2.html HTTP 200 + public profit/odds audit PASS, audit SHA $pages_sha)" >> "$GITHUB_ENV"

      - name: 13b. 定時監査：Pages・公開RMC PASS
        if: env.RMC_DRY_RUN != 'true' && env.RMC_IS_SCHEDULED == 'true'
        run: |
          node scripts/rmc-scheduled-checklist.mjs --file "$WORK/scheduled-update-checklist.json" --run-id "$RMC_RUN_ID" --phase pages --detail "${PAGES_RESULT:-Pages/public profit audit PASS}"
          node scripts/rmc-scheduled-checklist.mjs --file "$WORK/scheduled-update-checklist.json" --run-id "$RMC_RUN_ID" --phase public --detail "public RMC run/system-analysis/profit verification PASS"

      - name: 14. 定時41項目監査を必ずmainへ保存
        if: always() && env.RMC_IS_SCHEDULED == 'true'
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ ! -f "$WORK/scheduled-update-checklist.json" ]; then
            cp data/scheduled-update-checklist.json "$WORK/scheduled-update-checklist.json"
          fi
          if [ "$JOB_STATUS" = "success" ] && [ "$RMC_DRY_RUN" != "true" ]; then
            node scripts/rmc-scheduled-checklist.mjs --file "$WORK/scheduled-update-checklist.json" --run-id "$RMC_RUN_ID" --success --detail "checks 1-40 completed"
          else
            node scripts/rmc-scheduled-checklist.mjs --file "$WORK/scheduled-update-checklist.json" --run-id "$RMC_RUN_ID" --fail --detail "production workflow status=$JOB_STATUS; incomplete checks are blocked"
          fi
          cp "$WORK/scheduled-update-checklist.json" /tmp/rmc-run-checklist.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pushed=0
          checklist_sha=""
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            RUN_ID="$RMC_RUN_ID" node - <<'NODE'
          const fs=require("fs");
          const runId=process.env.RUN_ID;
          const incoming=JSON.parse(fs.readFileSync("/tmp/rmc-run-checklist.json","utf8"));
          const src=(incoming.runs||[]).find(r=>r.run_id===runId);
          if(!src) throw new Error("run missing in temp checklist: "+runId);
          let dst={schema_version:1,latest_run_id:null,runs:[]};
          try{dst=JSON.parse(fs.readFileSync("data/scheduled-update-checklist.json","utf8"))}catch{}
          dst.runs=(dst.runs||[]).filter(r=>r.run_id!==runId);
          dst.runs.push(src);
          dst.runs=dst.runs.slice(-40);
          dst.latest_run_id=runId;
          fs.writeFileSync("data/scheduled-update-checklist.json",JSON.stringify(dst,null,2)+"\n");
          NODE
            git add data/scheduled-update-checklist.json
            if git diff --cached --quiet; then pushed=1; checklist_sha=$(git rev-parse HEAD); break; fi
            git commit -m "RMC 41-check audit: $RMC_RUN_ID"
            if git push origin HEAD:main; then pushed=1; checklist_sha=$(git rev-parse HEAD); break; fi
            sleep 2
          done
          [ "$pushed" = "1" ] || exit 1
          echo "CHECKLIST_SHA=$checklist_sha" >> "$GITHUB_ENV"

          # 成功runは、41/41 PASSの台帳自体がPagesへ公開されたことまで確認。
          if [ "$JOB_STATUS" = "success" ] && [ "$RMC_DRY_RUN" != "true" ]; then
            owner="${GITHUB_REPOSITORY%%/*}"; repo="${GITHUB_REPOSITORY#*/}"; base="https://${owner}.github.io/${repo}"
            visible=0
            for i in $(seq 1 60); do
              rm -f /tmp/public-checklist.json
              curl -fsS "$base/data/scheduled-update-checklist.json?cb=$RANDOM" -o /tmp/public-checklist.json || true
              if [ -s /tmp/public-checklist.json ] && RUN_ID="$RMC_RUN_ID" node -e 'try{const j=JSON.parse(require("fs").readFileSync("/tmp/public-checklist.json","utf8"));const r=(j.runs||[]).find(x=>x.run_id===process.env.RUN_ID);process.exit(r?.status==="passed"&&r?.summary?.pass===41?0:1)}catch{process.exit(1)}'; then visible=1; break; fi
              sleep 10
            done
            [ "$visible" = "1" ] || exit 1
          fi

      - name: 実行結果のまとめ
        if: always()
        run: |
          {
            echo "## RMC production update: ${RMC_RUN_ID}"
            echo "- source: ${RMC_SOURCE}"
            echo "- dry_run: ${RMC_DRY_RUN}"
            echo "- start_sha: ${START_SHA:-—}"
            echo "- end_sha: ${END_SHA:-（コミットなし）}"
            echo "- pages_result: ${PAGES_RESULT:-—}"
            echo '```'
            for f in "$WORK/dry-run.json" "$WORK/apply.json"; do
              [ -f "$f" ] && node -e "const r=JSON.parse(require('fs').readFileSync('$f','utf8'));console.log('$f'.split('/').pop(), 'ok='+r.ok, 'errors='+r.errors.length, 'added='+r.items.filter(i=>i.action==='added').length, 'updated='+r.items.filter(i=>i.action==='updated').length, 'unchanged='+r.items.filter(i=>i.action==='unchanged').length, 'rejected='+r.items.filter(i=>i.action==='rejected').length);for(const e of r.errors.slice(0,30))console.log('  ['+e.category+'] '+e.system+' '+(e.id??'')+': '+e.message)"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
