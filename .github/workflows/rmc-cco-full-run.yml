name: RMC CCO Full Production Run

on:
  push:
    branches: [main]
    paths:
      - "ops/cco-run.trigger"
  workflow_dispatch:
  schedule:
    # JST 05:00 / 16:00 / 21:00 に開始し、06:00 / 17:00 / 22:00 枠を完成させる
    - cron: "0 20 * * *"
    - cron: "0 7 * * *"
    - cron: "0 12 * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: rmc-cco-full-production
  cancel-in-progress: true

jobs:
  full-run:
    runs-on: [self-hosted, rmc-japan]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve trigger
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require("fs");
          let x;
          if(process.env.GITHUB_EVENT_NAME==="schedule"){
            const ev=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH,"utf8"));
            const cron=ev.schedule||"";
            const slot=cron==="0 20 * * *"?"06:00":cron==="0 7 * * *"?"17:00":cron==="0 12 * * *"?"22:00":null;
            if(!slot) throw new Error("unknown scheduled cron: "+cron);
            const parts=Object.fromEntries(new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date()).filter(v=>v.type!=="literal").map(v=>[v.type,v.value]));
            x={run_id:"rmc-"+parts.year+parts.month+parts.day+"-"+slot.slice(0,2)+"00",slot,mode:"full_production",engine:"CCO"};
          }else{
            x=JSON.parse(fs.readFileSync("ops/cco-run.trigger","utf8"));
          }
          if(!/^rmc-\d{8}-(0600|1700|2200)$/.test(x.run_id||"")) throw new Error("invalid run_id");
          if(!["06:00","17:00","22:00"].includes(x.slot)) throw new Error("invalid slot");
          fs.appendFileSync(process.env.GITHUB_ENV,
            "RMC_RUN_ID="+x.run_id+"\n"+
            "RMC_SLOT="+x.slot+"\n"+
            "RMC_SOURCE=CCO full production runner\n");
          console.log(JSON.stringify({run_id:x.run_id,slot:x.slot,mode:x.mode,engine:x.engine}));
          NODE

      - name: Install browser runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Full CCO production run
        shell: bash
        run: bash scripts/run-rmc-cco-production.sh
