name: RMC CCO Full Production Run

on:
  push:
    branches: [main]
    paths:
      - "ops/cco-run.trigger"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: rmc-cco-full-production
  cancel-in-progress: true

jobs:
  full-run:
    runs-on: [self-hosted, rmc-japan]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve trigger
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("ops/cco-run.trigger","utf8"));
          if(!/^rmc-\d{8}-(0600|1700|2200)$/.test(x.run_id||"")) throw new Error("invalid run_id");
          if(!["06:00","17:00","22:00"].includes(x.slot)) throw new Error("invalid slot");
          fs.appendFileSync(process.env.GITHUB_ENV,
            "RMC_RUN_ID="+x.run_id+"\n"+
            "RMC_SLOT="+x.slot+"\n"+
            "RMC_SOURCE=CCO full production runner\n");
          console.log(JSON.stringify({run_id:x.run_id,slot:x.slot,mode:x.mode,engine:x.engine}));
          NODE

      - name: Install browser runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Full CCO production run
        shell: bash
        run: bash scripts/run-rmc-cco-production.sh
