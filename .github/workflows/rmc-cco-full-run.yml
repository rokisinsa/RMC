name: RMC CCO Full Production Run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "例: rmc-20260930-1700"
        required: true
        type: string
      slot:
        description: "06:00 / 17:00 / 22:00"
        required: true
        type: choice
        options: ["06:00","17:00","22:00"]
  schedule:
    # 完全run開始: JST 05:00 / 16:00 / 21:00 → 公開目標 06:00 / 17:00 / 22:00
    - cron: "0 20,7,12 * * *"
  push:
    branches: [main]
    paths:
      - "ops/cco-run.trigger"
      - ".github/workflows/rmc-cco-full-run.yml"
      - "scripts/run-rmc-cco-full.sh"

permissions:
  contents: write
  pages: write
  actions: read

concurrency:
  group: rmc-cco-full-production
  cancel-in-progress: true

jobs:
  full-run:
    runs-on: [self-hosted, rmc-japan]
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve requested run
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            run_id='${{ inputs.run_id }}'
            slot='${{ inputs.slot }}'
          elif [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            eval "$(node - <<'NODE'
const now=new Date();
const parts=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Tokyo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",hour12:false}).formatToParts(now).filter(x=>x.type!=="literal").map(x=>[x.type,x.value]));
const h=Number(parts.hour);
const slot=h<10?"06:00":h<19?"17:00":"22:00";
const hh=slot.slice(0,2), id=`rmc-${parts.year}${parts.month}${parts.day}-${hh}00`;
console.log(`run_id=${id}`);
console.log(`slot=${slot}`);
NODE
)"
          else
            run_id="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("ops/cco-run.trigger","utf8"));process.stdout.write(x.run_id)')"
            slot="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("ops/cco-run.trigger","utf8"));process.stdout.write(x.slot)')"
          fi
          echo "RMC_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "RMC_SLOT=$slot" >> "$GITHUB_ENV"
          echo "RMC_SOURCE=CCO full production runner" >> "$GITHUB_ENV"

      - name: Reject already-published run
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const id=process.env.RMC_RUN_ID;
          const a=JSON.parse(fs.readFileSync("data/automation-runs.json","utf8"));
          const old=(a.runs||[]).find(x=>x.run_id===id);
          if(old?.pages_result==="published"){
            console.error("run already published: "+id);
            process.exit(1);
          }
          NODE

      - name: Install browser runtime
        shell: bash
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: CCO fresh collection + complete research + payload validation
        shell: bash
        run: bash scripts/run-rmc-cco-full.sh

      - name: Apply payload and full production validations
        shell: bash
        run: |
          set -euo pipefail
          START_SHA="$(cat tmp/cco-start-sha.txt)"
          mkdir -p .tmp-tests/cco-production
          cp data/scheduled-update-checklist.json .tmp-tests/cco-production/checklist.json
          scheduled_for="$(node -e 'const m=process.env.RMC_RUN_ID.match(/^rmc-(\d{4})(\d{2})(\d{2})-/);process.stdout.write(m[1]+"-"+m[2]+"-"+m[3]+"T"+process.env.RMC_SLOT+":00+09:00")')"
          node scripts/rmc-scheduled-checklist.mjs --file .tmp-tests/cco-production/checklist.json --run-id "$RMC_RUN_ID" --slot "$RMC_SLOT" --scheduled-for "$scheduled_for" --source "$RMC_SOURCE" --start-sha "$START_SHA" --inventory
          node scripts/rmc-production-update.mjs --payload "incoming/$RMC_RUN_ID.json" --dry-run --start-sha "$START_SHA" --report .tmp-tests/cco-production/dry-run.json
          node scripts/rmc-scheduled-checklist.mjs --file .tmp-tests/cco-production/checklist.json --run-id "$RMC_RUN_ID" --payload "incoming/$RMC_RUN_ID.json" --report .tmp-tests/cco-production/dry-run.json
          node scripts/rmc-production-update.mjs --payload "incoming/$RMC_RUN_ID.json" --apply --start-sha "$START_SHA" --report .tmp-tests/cco-production/apply.json
          node scripts/rmc-production-update.mjs --check-diff
          npm test
          node scripts/snapshot-manifest.js verify
          node scripts/validate-data.js
          node scripts/check-locked.js "$START_SHA"
          node scripts/audit-report.js
          node scripts/rmc-scheduled-checklist.mjs --file .tmp-tests/cco-production/checklist.json --run-id "$RMC_RUN_ID" --phase tests --detail "CCO full research + tests PASS"
          node scripts/rmc-production-update.mjs --finalize --run-id "$RMC_RUN_ID" --actions-result pass
          node scripts/validate-data.js

      - name: Commit inventory, payload and production data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "RMC CCO Runner"
          git config user.email "rmc-cco@users.noreply.github.com"
          git add incoming data
          git commit -m "RMC CCO full production update: $RMC_RUN_ID"
          git push origin HEAD:main
          echo "END_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Mark commit phase
        shell: bash
        run: |
          node scripts/rmc-scheduled-checklist.mjs --file .tmp-tests/cco-production/checklist.json --run-id "$RMC_RUN_ID" --phase commit --detail "CCO main push PASS: $END_SHA" --end-sha "$END_SHA"

      - name: Verify Pages and public RMC
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${owner}.github.io/${repo}"
          published=0
          for i in $(seq 1 60); do
            if curl -fsS "$base/data/automation-runs.json?cb=$RANDOM" | grep -q "\"run_id\": \"$RMC_RUN_ID\""; then
              if node scripts/verify-public-profit.mjs --base "$base" --run-id "$RMC_RUN_ID" --payload "incoming/$RMC_RUN_ID.json"; then
                published=1
                break
              fi
            fi
            sleep 10
          done
          [ "$published" = "1" ] || exit 1
          node scripts/rmc-production-update.mjs --finalize-pages --run-id "$RMC_RUN_ID"
          node scripts/rmc-scheduled-checklist.mjs --file .tmp-tests/cco-production/checklist.json --run-id "$RMC_RUN_ID" --phase pages --detail "Pages/public profit audit PASS"
          node scripts/rmc-scheduled-checklist.mjs --file .tmp-tests/cco-production/checklist.json --run-id "$RMC_RUN_ID" --phase public --detail "public RMC/system-analysis/profit verification PASS"
          node scripts/rmc-scheduled-checklist.mjs --file .tmp-tests/cco-production/checklist.json --run-id "$RMC_RUN_ID" --success --detail "CCO checks 1-40 completed"
          node scripts/validate-scheduled-checklist.mjs .tmp-tests/cco-production/checklist.json
          cp .tmp-tests/cco-production/checklist.json data/scheduled-update-checklist.json
          git add data/automation-runs.json data/scheduled-update-checklist.json
          git commit -m "RMC CCO Pages verified: $RMC_RUN_ID"
          git push origin HEAD:main

      - name: Final proof
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const id=process.env.RMC_RUN_ID;
          const c=JSON.parse(fs.readFileSync("data/scheduled-update-checklist.json","utf8"));
          const r=(c.runs||[]).find(x=>x.run_id===id);
          console.log(JSON.stringify(r,null,2));
          if(!r || r.status!=="passed" || r.summary?.pass!==41 || r.summary?.fail!==0 || r.summary?.blocked!==0 || r.summary?.pending!==0) process.exit(1);
          NODE
