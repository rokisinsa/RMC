# 自動テスト専用（スキーマ検証・計算検証・重複検出・locked 保護）。
# 候補探索・分析などの AI 処理はここへ移さない。
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: RMC取得スクリプト構文検査
        shell: bash
        run: |
          node --check scripts/scrape-bet-channel.mjs
          node --check scripts/scrape-bet-channel-fixed-odds-local.mjs
          node --check scripts/build-bet-channel-complete-inventory.mjs
          node --check analysis-v2.js
          node --check scripts/rmc-scheduled-checklist.mjs
          bash -n scripts/run-fixed-odds-vps.sh
          bash -n scripts/install-fixed-odds-vps.sh
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$errs=$null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/run-fixed-odds-local.ps1",[ref]$null,[ref]$errs) > $null; if($errs.Count){$errs | ForEach-Object { Write-Error $_ }; exit 1 }'
            pwsh -NoProfile -Command '$errs=$null; [System.Management.Automation.Language.Parser]::ParseFile("scripts/install-fixed-odds-scheduler.ps1",[ref]$null,[ref]$errs) > $null; if($errs.Count){$errs | ForEach-Object { Write-Error $_ }; exit 1 }'
          fi

      - name: テスト（snapshot 段＝移行時点の検証 / live 段＝現在データの検証）
        run: npm test

      - name: 移行スナップショットの不変性
        run: node scripts/snapshot-manifest.js verify

      - name: 監査レポート（競技偏り・損益/ROI/CLV・データ品質）
        run: node scripts/audit-report.js

      - name: data/*.json のスキーマ・整合性検証（未作成ならスキップ）
        run: node scripts/validate-data.js

      - name: locked 事前値の保護（直前の状態と比較）
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-locked.js "$BASE_SHA"

      - name: 実運用リハーサル（架空の定時更新を data/ のコピーへ適用して検証。data/ は変更しない）
        run: node scripts/rehearsal.js rehearsals/RMC-20260926-REHEARSAL-01
