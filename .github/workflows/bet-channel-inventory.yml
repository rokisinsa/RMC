name: BET CHANNEL complete inventory

on:
  push:
    branches: [main]
    paths:
      - "scripts/scrape-bet-channel.mjs"
      - ".github/workflows/bet-channel-inventory.yml"
  workflow_dispatch:
  schedule:
    # JST 05:30 / 11:30 / 17:30 / 22:30
    - cron: "30 20,2,8,13 * * *"

permissions:
  contents: write

concurrency:
  group: bet-channel-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Scrape BET CHANNEL all categories and events
        id: scrape
        shell: bash
        run: |
          set +e
          node scripts/scrape-bet-channel.mjs data/bet-channel-inventory.json | tee /tmp/bc-summary.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/bc-summary.txt >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Validate inventory structure
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("data/bet-channel-inventory.json","utf8"));
          const errors=[];
          if(!x.menu_end_verified) errors.push("menu_end_verified=false");
          if(x.category_count!==x.categories.length) errors.push("category_count mismatch");
          if(x.event_count!==x.event_ids.length) errors.push("event_count mismatch");
          if(new Set(x.event_ids).size!==x.event_ids.length) errors.push("duplicate event_ids");
          if(new Set(x.categories.map(c=>c.ct)).size!==x.categories.length) errors.push("duplicate category ct");
          if(x.metadata_missing_count!==0) errors.push("metadata missing");
          if(x.time_parse_missing_count!==0) errors.push("time parse missing");
          if(!x.analysis_ready) errors.push("analysis_ready=false");
          if(x.screening_event_count!==x.screening_event_ids.length) errors.push("screening_event_count mismatch");
          if(new Set(x.screening_event_ids).size!==x.screening_event_ids.length) errors.push("duplicate screening event ids");
          if(!x.integrity?.screening_event_count_matches_ids) errors.push("screening ids integrity failed");
          if(!x.integrity?.screening_category_counts_sum) errors.push("screening category counts mismatch");
          if(!x.integrity?.priority_12h_is_subset) errors.push("priority 12h is not subset of screening universe");
          if(x.analysis_card_count!==x.analysis_card_ids.length) errors.push("analysis_card_count mismatch");
          if(new Set(x.analysis_card_ids).size!==x.analysis_card_ids.length) errors.push("duplicate analysis card ids");
          console.log(JSON.stringify({checked_at:x.checked_at,category_count:x.category_count,event_count:x.event_count,screening_event_count:x.screening_event_count,priority_12h_event_count:x.priority_12h_event_count,analysis_card_count:x.analysis_card_count,failed:x.failed_category_count,empty:x.empty_category_count,complete:x.complete,errors},null,2));
          if(errors.length) process.exit(1);
          NODE

      - name: Commit measured inventory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bet-channel-inventory.json
          if git diff --cached --quiet; then
            echo "No inventory diff"
          else
            git commit -m "Update BET CHANNEL inventory"
            # 別のRMC更新が同時にmainへ入っても、最新mainへ追従してから保存する。
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              echo "inventory push retry $attempt/3"
              sleep 2
            done
            echo "Failed to persist measured inventory after 3 retries"
            exit 1
          fi

      - name: Enforce complete scrape
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("data/bet-channel-inventory.json","utf8"));
          if(!x.complete || !x.analysis_ready || x.failed_category_count!==0 || x.metadata_missing_count!==0 || x.time_parse_missing_count!==0){
            console.error(`Incomplete BET CHANNEL scrape: failed=${x.failed_category_count} metadata=${x.metadata_missing_count} time_parse=${x.time_parse_missing_count} analysis_ready=${x.analysis_ready}`);
            process.exit(1);
          }
          console.log(`COMPLETE: ${x.category_count} categories / ${x.event_count} collected market events / ${x.screening_event_count} currently listed sports/esports events for full screening / ${x.priority_12h_event_count} priority next-12h / ${x.analysis_card_count} canonical 48h cards`);
          NODE
