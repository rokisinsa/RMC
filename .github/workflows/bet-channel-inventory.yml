name: BET CHANNEL complete inventory
# Manual full-run trigger: 2026-09-28 21:49 JST
# RMC 41-check chain probe: inventory completion/failure must feed scheduled audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/scrape-bet-channel.mjs"
      - "scripts/select-bet-channel-inventory.mjs"
      - "data/bet-channel-fixed-odds-inventory.json"
      - ".github/workflows/bet-channel-inventory.yml"
  workflow_dispatch:
  schedule:
    # JST 05:30 / 11:30 / 17:30 / 22:30
    - cron: "30 20,2,8,13 * * *"

permissions:
  contents: write

concurrency:
  group: bet-channel-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Scrape BET CHANNEL + self-healing retry
        id: scrape
        shell: bash
        run: |
          set +e
          cp data/bet-channel-inventory.json /tmp/bc-attempt1.json 2>/dev/null || true
          node scripts/scrape-bet-channel.mjs /tmp/bc-attempt1.json | tee /tmp/bc-summary-1.txt
          code1=${PIPESTATUS[0]}

          if [ "$code1" -ne 0 ]; then
            echo "First scrape process failed (exit=$code1); stale attempt1 is invalid and will not be reused." | tee -a /tmp/bc-summary-1.txt
            rm -f /tmp/bc-attempt1.json
            need_retry=yes
          else
            need_retry=$(node - <<'NODE'
          const fs=require("fs");
          try{
            const x=JSON.parse(fs.readFileSync("/tmp/bc-attempt1.json","utf8"));
            process.stdout.write((x.self_audit?.requires_rescan || !x.complete || !x.analysis_ready) ? "yes" : "no");
          }catch{ process.stdout.write("yes"); }
          NODE
            )
          fi

          code2=0
          if [ "$need_retry" = "yes" ]; then
            echo "Scrape retry required; running one full automatic rescan." | tee -a /tmp/bc-summary-1.txt
            cp data/bet-channel-inventory.json /tmp/bc-attempt2.json 2>/dev/null || true
            node scripts/scrape-bet-channel.mjs /tmp/bc-attempt2.json | tee /tmp/bc-summary-2.txt
            code2=${PIPESTATUS[0]}
            if [ "$code2" -ne 0 ]; then
              echo "Retry scrape process failed (exit=$code2); stale attempt2 is invalid." | tee -a /tmp/bc-summary-2.txt
              rm -f /tmp/bc-attempt2.json
            fi
          fi

          set -e
          if [ ! -f /tmp/bc-attempt1.json ] && [ ! -f /tmp/bc-attempt2.json ]; then
            echo "No valid fresh scrape output exists; refusing to reuse previous inventory."
            exit 1
          fi

          if [ ! -f /tmp/bc-attempt1.json ] && [ -f /tmp/bc-attempt2.json ]; then
            mv /tmp/bc-attempt2.json /tmp/bc-attempt1.json
          fi

          args=(--attempt1 /tmp/bc-attempt1.json --out data/bet-channel-inventory.json)
          if [ -f /tmp/bc-attempt2.json ]; then args+=(--attempt2 /tmp/bc-attempt2.json); fi
          node scripts/select-bet-channel-inventory.mjs "${args[@]}" --summary data/bet-channel-screening-summary.json | tee /tmp/bc-selection.txt

          echo "attempt1_exit=$code1" >> "$GITHUB_OUTPUT"
          echo "attempt2_exit=$code2" >> "$GITHUB_OUTPUT"
          cat /tmp/bc-summary-1.txt >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/bc-summary-2.txt ]; then cat /tmp/bc-summary-2.txt >> "$GITHUB_STEP_SUMMARY"; fi
          cat /tmp/bc-selection.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Validate inventory structure
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const x=JSON.parse(fs.readFileSync("data/bet-channel-inventory.json","utf8"));
          const errors=[];
          if(!x.menu_end_verified) errors.push("menu_end_verified=false");
          if(x.category_count!==x.categories.length) errors.push("category_count mismatch");
          if(x.event_count!==x.event_ids.length) errors.push("event_count mismatch");
          if(new Set(x.event_ids).size!==x.event_ids.length) errors.push("duplicate event_ids");
          if(new Set(x.categories.map(c=>c.ct)).size!==x.categories.length) errors.push("duplicate category ct");
          if(x.metadata_missing_count!==0) errors.push("metadata missing");
          if(x.time_parse_missing_count!==0) errors.push("time parse missing");
          if(!x.analysis_ready) errors.push("analysis_ready=false");
          if(!x.self_audit) errors.push("self_audit missing");
          if(!["pass","pass_after_remediation"].includes(x.self_audit?.status)) errors.push("self_audit status not pass");
          if(x.self_audit?.requires_rescan) errors.push("self_audit still requires rescan");
          if((x.self_audit?.unresolved_blockers??1)!==0) errors.push("self_audit unresolved blockers");
          if(x.screening_event_count!==x.screening_event_ids.length) errors.push("screening_event_count mismatch");
          if(new Set(x.screening_event_ids).size!==x.screening_event_ids.length) errors.push("duplicate screening event ids");
          if(!x.integrity?.screening_event_count_matches_ids) errors.push("screening ids integrity failed");
          if(!x.integrity?.screening_category_counts_sum) errors.push("screening category counts mismatch");
          if(!x.integrity?.priority_12h_is_subset) errors.push("priority 12h is not subset of screening universe");
          if(x.analysis_card_count!==x.analysis_card_ids.length) errors.push("analysis_card_count mismatch");
          if(new Set(x.analysis_card_ids).size!==x.analysis_card_ids.length) errors.push("duplicate analysis card ids");
          console.log(JSON.stringify({checked_at:x.checked_at,category_count:x.category_count,event_count:x.event_count,screening_event_count:x.screening_event_count,priority_12h_event_count:x.priority_12h_event_count,analysis_card_count:x.analysis_card_count,failed:x.failed_category_count,empty:x.empty_category_count,complete:x.complete,self_audit_status:x.self_audit?.status,self_audit_anomalies:x.self_audit?.anomaly_count,remediation_status:x.self_audit?.remediation_status,fixes_applied:x.self_audit?.fixes_applied,errors},null,2));
          if(errors.length) process.exit(1);
          NODE

      - name: Build complete BET CHANNEL union
        id: union
        shell: bash
        run: |
          set +e
          node scripts/build-bet-channel-complete-inventory.mjs \
            data/bet-channel-screening-summary.json \
            data/bet-channel-fixed-odds-inventory.json \
            data/bet-channel-complete-summary.json | tee /tmp/bc-complete-union.txt
          union_code=${PIPESTATUS[0]}
          set -e
          cat /tmp/bc-complete-union.txt >> "$GITHUB_STEP_SUMMARY"
          echo "union_exit=$union_code" >> "$GITHUB_OUTPUT"

      - name: Commit measured inventory
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 生成結果を退避し、毎回最新mainを土台に戻してから2ファイルだけ重ねる。
          # 古いworkflow SHAの手動再実行でもdataファイル同士をrebase競合させない。
          cp data/bet-channel-inventory.json /tmp/generated-bet-channel-inventory.json
          cp data/bet-channel-screening-summary.json /tmp/generated-bet-channel-screening-summary.json
          cp data/bet-channel-fixed-odds-cloud-status.json /tmp/generated-bet-channel-fixed-odds-cloud-status.json
          cp data/bet-channel-complete-summary.json /tmp/generated-bet-channel-complete-summary.json

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/generated-bet-channel-inventory.json data/bet-channel-inventory.json
            cp /tmp/generated-bet-channel-screening-summary.json data/bet-channel-screening-summary.json
            cp /tmp/generated-bet-channel-fixed-odds-cloud-status.json data/bet-channel-fixed-odds-cloud-status.json
            cp /tmp/generated-bet-channel-complete-summary.json data/bet-channel-complete-summary.json
            git add data/bet-channel-inventory.json data/bet-channel-screening-summary.json data/bet-channel-fixed-odds-cloud-status.json data/bet-channel-complete-summary.json

            if git diff --cached --quiet; then
              echo "No inventory diff after syncing latest main"
              exit 0
            fi

            git commit -m "Update BET CHANNEL inventory"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "inventory push retry $attempt/3"
            sleep 2
          done

          echo "Failed to persist measured inventory after 3 retries"
          exit 1

      - name: Enforce complete scrape
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const legacy=JSON.parse(fs.readFileSync("data/bet-channel-inventory.json","utf8"));
          const complete=JSON.parse(fs.readFileSync("data/bet-channel-complete-summary.json","utf8"));
          let fixed=null;
          try{ fixed=JSON.parse(fs.readFileSync("data/bet-channel-fixed-odds-inventory.json","utf8")); }catch{}
          if(!legacy.complete || !legacy.analysis_ready || legacy.failed_category_count!==0 || legacy.metadata_missing_count!==0 || legacy.time_parse_missing_count!==0 || !["pass","pass_after_remediation"].includes(legacy.self_audit?.status) || legacy.self_audit?.requires_rescan || legacy.self_audit?.unresolved_blockers!==0){
            console.error(`Incomplete BET CHANNEL legacy scrape: failed=${legacy.failed_category_count} metadata=${legacy.metadata_missing_count} time_parse=${legacy.time_parse_missing_count} analysis_ready=${legacy.analysis_ready} self_audit=${legacy.self_audit?.status}`);
            process.exit(1);
          }
          if(!fixed || fixed.complete!==true || fixed.analysis_ready!==true || fixed.access_status!=="direct" || fixed.menu_end_verified!==true || fixed.event_count!==fixed.event_ids?.length || fixed.screening_event_count!==fixed.screening_event_ids?.length || fixed.self_audit?.unresolved_blockers!==0){
            console.error("Japan fixed-odds/eSports inventory is missing or incomplete; complete scheduled update is blocked.");
            process.exit(1);
          }
          if(!complete.complete || !complete.analysis_ready || complete.self_audit?.unresolved_blockers!==0){
            console.error(`Incomplete BET CHANNEL union: blockers=${JSON.stringify(complete.self_audit?.blockers||[])}`);
            process.exit(1);
          }
          console.log(`BET CHANNEL UNION COMPLETE: ${complete.category_count} categories / ${complete.event_count} events / ${complete.screening_event_count} screening events`);
          console.log(`LEGACY: ${complete.component_status.legacy.screening_event_count} screening / FIXED ESPORTS: ${complete.component_status.fixed_odds.screening_event_count} screening / source=${complete.component_status.fixed_odds.source_machine}`);
          NODE
